name: Publish to GHCR
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    tags:
      # Release tags, e.g. V2.3.0.0. The leading V is stripped from image tags.
      - '[Vv][0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[Vv][0-9]+.[0-9]+.[0-9]+'
  # dev/PR builds land on :next as a preview - build it on every PR update too,
  # not just once dev has already merged it.
  pull_request:
    types: [opened, synchronize, reopened]
  # Publishing a release from the GitHub UI against a tag that already exists
  # creates no new ref, so it fires no push event. This trigger is what makes
  # the UI flow work.
  release:
    types: [published]

concurrency:
  # Publishing a release with a brand new tag fires a tag push *and* a release
  # event. Both would build the same ref, so collapse them into one run.
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push:
    name: Create build and push to GHCR
    runs-on: ubuntu-latest
    # A PR from a fork gets a read-only GITHUB_TOKEN, so login/push would just
    # fail - skip it rather than fail the check. :next still gets rebuilt off
    # dev, and off any PR opened from a branch in this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # packages: publish the image. contents: create the release on a tag.
      packages: write
      contents: write
    strategy:
      fail-fast: false
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - id: string
        uses: ASzc/change-string-case-action@v5
        with:
          string: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Release version comes from the tag itself, so the image tag can never
      # drift from the ref that produced it.
      - id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "number=${GITHUB_REF_NAME#[Vv]}" >> "$GITHUB_OUTPUT"
      # A push to master publishes :latest directly - master is always the
      # stable, released state of the code, so it owns :latest without
      # waiting on a version tag.
      - name: Push :latest (master)
        uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/master'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5api:latest
      # dev and PR builds publish :next -- the rolling preview build. PRs get
      # amd64-only so review builds stay fast; dev keeps the full platform
      # matrix since it's what people actually pull to test on real hardware.
      - name: Push :next (dev / PR)
        uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm/v7,linux/arm64/v8' }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5api:next
      # A release tag publishes just the version - :latest already tracks
      # master, which is what every tag is cut from.
      - name: Push :<version> (tag)
        uses: docker/build-push-action@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ steps.string.outputs.lowercase }}/g5api:${{ steps.version.outputs.number }}
      # Pull this version's section out of CHANGELOG.md to use as release notes.
      # Runs after the image push so a failed build never produces a release.
      - name: Extract release notes from CHANGELOG
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.number }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## / { exit }
            flag && /^\[.*\]: http/ { next }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Release notes for $VERSION:"
            cat release-notes.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md; \
              falling back to auto-generated notes."
          fi
      - name: Publish or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release already exists -- normally because it was created from
            # the GitHub UI, which is what triggered this run. Only fill in the
            # notes if it has none, so hand-written notes are never clobbered.
            EXISTING="$(gh release view "$TAG" --json body --jq '.body' | tr -d '[:space:]')"
            # gh emits a literal "null" when a release has no body at all.
            [ "$EXISTING" = "null" ] && EXISTING=""
            if [ -n "$EXISTING" ]; then
              echo "Release $TAG already has notes; leaving them untouched."
            elif [ "${{ steps.notes.outputs.found }}" = "true" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
              echo "Filled in empty notes for release $TAG from CHANGELOG.md."
            else
              echo "::warning::Release $TAG has no notes and CHANGELOG.md has \
                no section for it."
            fi
          elif [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "$TAG" --title "$TAG" \
              --notes-file release-notes.md --verify-tag
            echo "Created release $TAG from CHANGELOG.md."
          else
            gh release create "$TAG" --title "$TAG" \
              --generate-notes --verify-tag
            echo "Created release $TAG with auto-generated notes."
          fi
